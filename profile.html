<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Profile</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(to bottom, #a5f3fc, #fef9c3);
      font-family: 'Segoe UI', sans-serif;
      height: 100vh;
    }

    .navbar {
      background-color: #fff;
      border-bottom: 3px solid #facc15;
    }

    .nav-link {
      font-weight: 500;
      position: relative;
      color: #333;
    }

    .nav-link:hover {
      color: #facc15;
    }

    .nav-link.active::after {
      content: "";
      position: absolute;
      width: 100%;
      height: 3px;
      background: #facc15;
      left: 0;
      bottom: -8px;
    }

    .card-custom {
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      border: none;
      background: white;
    }

    .banner {
      margin-top: 10px;
      border-radius: 16px;
      height: 150px;
      object-fit: cover;
      width: 100%;
    }

    .title {
      color: #facc15;
      font-weight: bold;
      text-shadow: 1px 1px 0 #000;
    }

    .sponge-img {
      display: block;
      margin: auto;
      width: 80px;
      margin-bottom: 10px;
    }

    .btn {
      transition: 0.3s;
      border-radius: 10px;
    }

    .btn:hover {
      transform: scale(1.05);
    }
  </style>

</head>

<body>

  <!-- NAVBAR -->
    <nav class="navbar navbar-expand shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold text-warning" href="index.html">
                My Web
            </a>

            <div class="navbar-collapse justify-content-center">
                <ul class="navbar-nav gap-3">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="profile.html">Profile</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="game.html">Game</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="contact.html">Contact</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

  <div class="container center-page" style="max-width:600px;">

    <!-- Banner -->
    <img
      src="https://m.media-amazon.com/images/S/aplus-media-library-service-media/5aa3b7cf-1707-4fa2-b2ca-faaf5d712203.__CR0,0,2021,625_PT0_SX970_V1___.jpg"
      class="banner mb-3" alt="Banner">

    <!-- Profile Card -->
    <div class="card card-custom p-4 text-center">

      <img src="https://static.wikia.nocookie.net/660cd991-3bf9-4a90-a3c6-836ac47ed8eb/scale-to-width/755"
        class="sponge-img" alt="SpongeBob">

      <h5 class="mb-1 title">Felicia</h5>
      <p class="text-muted small">XI-B / 10</p>

    </div>

  </div>

  <footer class="text-center py-3 text-muted">
    © 2026 My Web
  </footer>

</body>

</html>
