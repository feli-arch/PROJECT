<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Profile</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(to bottom, #a5f3fc, #fef9c3);
      font-family: 'Segoe UI', sans-serif;
      overflow-x: hidden;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* NAVBAR */
    .navbar {
      background-color: #fff;
      border-bottom: 3px solid #facc15;
    }

    .nav-link {
      font-weight: 500;
      position: relative;
      color: #333;
    }

    .nav-link:hover {
      color: #facc15;
    }

    .nav-link.active::after {
      content: "";
      position: absolute;
      width: 100%;
      height: 3px;
      background: #facc15;
      left: 0;
      bottom: -8px;
    }

    /* PROFILE SECTION */
    .profile-section {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 15px;
    }

    .profile-container {
      width: 100%;
      max-width: 600px;
    }

    .card-custom {
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      border: none;
      background: white;
    }

    .banner {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 20px;
      margin-bottom: 20px;
    }

    .title {
      color: #facc15;
      font-weight: bold;
      text-shadow: 1px 1px 0 #000;
    }

    .profile-img {
      width: 90px;
      height: 90px;
      object-fit: cover;
      border-radius: 50%;
      display: block;
      margin: auto;
      margin-bottom: 15px;
      transition: transform 0.3s ease;
      cursor: pointer;
    }

    footer {
      text-align: center;
      padding: 15px;
      color: #555;
    }

    @media (max-width: 768px) {

      .profile-section {
        padding: 30px 15px;
      }

      .banner {
        height: 140px;
      }

      .nav-link.active::after {
        display: none;
      }

      .navbar-collapse {
        padding-top: 10px;
      }

      .navbar-nav {
        text-align: center;
      }
    }
  </style>
</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg shadow-sm">

    <div class="container">

      <a class="navbar-brand fw-bold text-warning" href="index.html">
        Sudoku
      </a>

      <!-- TOGGLE -->
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">

        <span class="navbar-toggler-icon"></span>

      </button>

      <!-- MENU -->
      <div class="collapse navbar-collapse justify-content-center" id="navbarNav">

        <ul class="navbar-nav gap-3">

          <li class="nav-item">
            <a class="nav-link" href="index.html">
              Home
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link active" href="profile.html">
              Profile
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="game.html">
              Game
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="contact.html">
              Contact
            </a>
          </li>

        </ul>

      </div>

    </div>

  </nav>

  <!-- PROFILE -->
  <section class="profile-section">

    <div class="profile-container">

      <!-- BANNER -->
      <img
        src="https://m.media-amazon.com/images/S/aplus-media-library-service-media/5aa3b7cf-1707-4fa2-b2ca-faaf5d712203.__CR0,0,2021,625_PT0_SX970_V1___.jpg"
        class="banner"
        alt="Banner">

      <!-- CARD -->
      <div class="card card-custom p-4 text-center">

        <img
          src="https://static.wikia.nocookie.net/660cd991-3bf9-4a90-a3c6-836ac47ed8eb/scale-to-width/755"
          class="profile-img"
          id="profileImage"
          alt="Profile">

        <h4 class="title mb-2" id="nameText">
          Felicia
        </h4>

        <p class="text-muted">
          XI-B / 10
        </p>

        <!-- BUTTON -->
        <button class="btn btn-warning mt-3" onclick="showMessage()">
          Klik Aku
        </button>

      </div>

    </div>

  </section>

  <!-- FOOTER -->
  <footer>
    © 2026 My Web
  </footer>

  <!-- BOOTSTRAP JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- JAVASCRIPT -->
  <script>

    // Alert saat tombol diklik
    function showMessage() {
      alert("Halo! Selamat datang di profile Felicia ✨");
    }

    // Efek zoom foto profile saat diklik
    const profileImage = document.getElementById("profileImage");

    profileImage.addEventListener("click", function () {

      if (profileImage.style.transform === "scale(1.3)") {
        profileImage.style.transform = "scale(1)";
      } else {
        profileImage.style.transform = "scale(1.3)";
      }

    });

    // Mengubah nama saat halaman dibuka
    window.onload = function () {
      document.getElementById("nameText").innerHTML = "Felicia Suwondo";
    };

  </script>

</body>

</html>
