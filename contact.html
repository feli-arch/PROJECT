<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to bottom, #a5f3fc, #fef9c3);
            font-family: 'Segoe UI', sans-serif;
            height: max-content;
        }

        .navbar {
            border-bottom: 3px solid #facc15;
            background-color: #fff;
        }

        .nav-link {
            font-weight: 500;
            position: relative;
            color: #333;
        }

        .nav-link:hover {
            color: #facc15;
        }

        .nav-link.active::after {
            content: "";
            position: absolute;
            width: 100%;
            height: 3px;
            background: #facc15;
            left: 0;
            bottom: -8px;
        }

        .contact-section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 40px 0;
        }

        .contact-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        .contact-title {
            font-weight: bold;
            color: #facc15;
            text-shadow: 1px 1px 0 #000;
        }

        .btn-custom {
            background-color: #facc15;
            border: none;
            color: black;
            font-weight: bold;
        }

        .btn-custom:hover {
            background-color: #eab308;
        }

        .form-control {
            border-radius: 10px;
        }

        footer {
            color: #555;
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold text-warning" href="index.html">
                My Web
            </a>

            <div class="navbar-collapse justify-content-center">
                <ul class="navbar-nav gap-3">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="profile.html">Profile</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="game.html">Game</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="contact.html">Contact</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- CONTACT -->
    <section class="contact-section">
        <div class="container">

            <div class="row justify-content-center">

                <div class="col-lg-8">

                    <div class="contact-card">

                        <h1 class="text-center contact-title mb-3">
                            Contact Us
                        </h1>

                        <p class="text-center text-muted mb-4">
                            Have questions or suggestions? Feel free to contact us.
                        </p>

                        <form>

                            <div class="row">

                                <div class="col-md-6 mb-3">
                                    <label class="form-label">First Name</label>
                                    <input type="text" class="form-control" placeholder="Enter first name">
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Last Name</label>
                                    <input type="text" class="form-control" placeholder="Enter last name">
                                </div>

                            </div>

                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" placeholder="Enter your email">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Subject</label>
                                <input type="text" class="form-control" placeholder="Enter subject">
                            </div>

                            <div class="mb-4">
                                <label class="form-label">Message</label>
                                <textarea class="form-control" rows="5" placeholder="Write your message"></textarea>
                            </div>

                            <div class="text-center">
                                <button type="submit" class="btn btn-custom px-5 py-2">
                                    Send Message
                                </button>
                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>
    </section>

    <!-- FOOTER -->
    <footer class="text-center py-3">
        © 2026 My Web
    </footer>

</body>

</html>
