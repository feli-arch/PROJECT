<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Home</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(to bottom, #a5f3fc, #fef9c3);
      font-family: 'Segoe UI', sans-serif;
      overflow-x: hidden;
    }

    .navbar {
      background-color: #fff;
      border-bottom: 3px solid #facc15;
    }

    .nav-link {
      font-weight: 500;
      position: relative;
      color: #333;
    }

    .nav-link:hover {
      color: #facc15;
    }

    .nav-link.active::after {
      content: "";
      position: absolute;
      width: 100%;
      height: 3px;
      background: #facc15;
      left: 0;
      bottom: -8px;
    }

    .hero {
      min-height: 83vh;
      padding: 40px 0;
      display: flex;
      align-items: center;
    }

    .text-main {
      color: #facc15;
      text-shadow: 1px 1px 0 #000;
    }

    img {
      border-radius: 16px;
    }

    @media (max-width: 768px) {

      .hero {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 50px 20px;
      }

      .hero-content {
        width: 100%;
      }

      .hero .row {
        min-height: 70vh;
        justify-content: center;
        align-items: center;
      }

      .hero img {
        margin-top: 30px;
        max-width: 100% !important;
      }

      .navbar-nav {
        text-align: center;
        padding-top: 10px;
      }

      .nav-link.active::after {
        display: none;
      }
    }
  </style>
</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg shadow-sm">

    <div class="container">

      <a class="navbar-brand fw-bold text-warning" href="index.html">
        Sudoku
      </a>

      <!-- TOGGLE -->
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- MENU -->
      <div class="collapse navbar-collapse justify-content-center" id="navbarNav">

        <ul class="navbar-nav gap-3">

          <li class="nav-item">
            <a class="nav-link active" href="index.html">Home</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="profile.html">Profile</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="game.html">Game</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="contact.html">Contact</a>
          </li>

        </ul>

      </div>

    </div>

  </nav>

  <!-- HERO -->
  <div class="container hero">

    <div class="row align-items-center w-100">

      <!-- TEXT -->
      <div class="col-md-6 text-center text-md-start">

        <h1 class="fw-bold">
          <span class="text-main">Sudoku</span> Game
        </h1>

        <p class="text-muted">
          Project HTML, Bootstrap, dan JavaScript
        </p>

      </div>

      <!-- IMAGE -->
      <div class="col-md-6 text-center mt-4 mt-md-0">

        <img
          src="https://pixel.disco.nowtv.com/uuid/f38b04b5-2885-3c7c-8d52-20685c57dcb9/LAND_16_9/1536/864?language=en-GB&proposition=NOWOTT&version=36e2a908-9aea-3887-80ff-c76559ab9914&output-format=webp"
          class="img-fluid shadow"
          style="max-width: 80%;"
          alt="Hero Image">

      </div>

    </div>

  </div>

  <!-- FOOTER -->
  <footer class="text-center py-3 text-muted">
    © 2026 My Web
  </footer>

  <!-- BOOTSTRAP JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
