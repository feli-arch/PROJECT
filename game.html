<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Game</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(to bottom, #a5f3fc, #fef9c3);
      font-family: 'Segoe UI', sans-serif;
      height: 100vh;
    }

    .navbar {
      border-bottom: 3px solid #facc15;
      background-color: #fff;
    }

    .nav-link {
      font-weight: 500;
      position: relative;
      color: #333;
    }

    .nav-link:hover {
      color: #facc15;
    }

    .nav-link.active::after {
      content: "";
      position: absolute;
      width: 100%;
      height: 3px;
      background: #facc15;
      left: 0;
      bottom: -8px;
    }

    .card-custom {
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      border: none;
      background: white;
    }

    .title {
      color: #facc15;
      font-weight: bold;
      text-shadow: 1px 1px 0 #000;
    }

    .grid-sudoku {
      display: grid;
      grid-template-columns: repeat(4, 65px);
      gap: 10px;
      justify-content: center;
    }

    input {
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      border-radius: 10px;
    }

    .btn {
      transition: 0.3s;
      border-radius: 12px;
    }

    .btn:hover {
      transform: scale(1.08);
    }

    .correct {
      animation: glow 0.5s ease-in-out;
    }

    @keyframes glow {
      0% {
        box-shadow: 0 0 0px green;
      }

      50% {
        box-shadow: 0 0 20px green;
      }

      100% {
        box-shadow: 0 0 0px green;
      }
    }

    .sponge-img {
      display: block;
      margin: auto;
      width: 80px;
      margin-bottom: 10px;
    }
  </style>

</head>

<body>
  <!-- NAVBAR -->
  <nav class="navbar navbar-expand shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold text-warning" href="index.html">
        Sudoku
      </a>

      <div class="navbar-collapse justify-content-center">
        <ul class="navbar-nav gap-3">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Home</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="profile.html">Profile</a>
          </li>

          <li class="nav-item">
            <a class="nav-link active" href="game.html">Game</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="contact.html">Contact</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-4" style="max-width:600px;">

    <div class="card card-custom p-4 text-center">

      <img src="https://static.wikia.nocookie.net/660cd991-3bf9-4a90-a3c6-836ac47ed8eb/scale-to-width/755"
        class="sponge-img" alt="SpongeBob">

      <h4 class="mb-2 title">Mini Sudoku</h4>
      <p class="small text-muted">Isi angka 1 - 4 tanpa ada yang sama</p>

      <div class="grid-sudoku">
        <input maxlength="1" class="form-control" id="c0">
        <input maxlength="1" class="form-control" id="c1">
        <input maxlength="1" class="form-control" id="c2" value="3">
        <input maxlength="1" class="form-control" id="c3">

        <input maxlength="1" class="form-control" id="c4" value="3">
        <input maxlength="1" class="form-control" id="c5">
        <input maxlength="1" class="form-control" id="c6">
        <input maxlength="1" class="form-control" id="c7">

        <input maxlength="1" class="form-control" id="c8">
        <input maxlength="1" class="form-control" id="c9">
        <input maxlength="1" class="form-control" id="c10">
        <input maxlength="1" class="form-control" id="c11" value="2">

        <input maxlength="1" class="form-control" id="c12">
        <input maxlength="1" class="form-control" id="c13" value="1">
        <input maxlength="1" class="form-control" id="c14">
        <input maxlength="1" class="form-control" id="c15">
      </div>

      <button class="btn btn-warning mt-3" onclick="cekSudoku()">Cek Jawaban</button>

      <p id="hasilSudoku" class="mt-3 small fw-bold"></p>
    </div> 
  </div>
  <footer class="text-center py-3 text-muted">
    © 2026 My Web
  </footer>

  <script>
    function cekSudoku() {
      let grid = [];

      for (let i = 0; i < 16; i++) {
        let val = document.getElementById("c" + i).value;
        grid.push(val);
      }

      function valid(arr) {
        let s = new Set(arr);
        return s.size === 4 && !arr.includes("");
      }

      let hasil = document.getElementById("hasilSudoku");

      for (let i = 0; i < 4; i++) {
        if (!valid(grid.slice(i * 4, i * 4 + 4))) {
          hasil.innerHTML = "❌ Masih salah 😢";
          hasil.style.color = "red";
          return;
        }
      }

      for (let i = 0; i < 4; i++) {
        let col = [grid[i], grid[i + 4], grid[i + 8], grid[i + 12]];
        if (!valid(col)) {
          hasil.innerHTML = "❌ Masih salah 😢";
          hasil.style.color = "red";
          return;
        }
      }

      hasil.innerHTML = "🎉 Benar! Kamu hebat!";
      hasil.style.color = "green";
      document.querySelector(".card-custom").classList.add("correct");
    }
  </script>

</body>

</html>
